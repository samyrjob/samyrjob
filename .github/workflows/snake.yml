# Goes in samyrjob/samyrjob as .github/workflows/snake.yml.
# Draws a snake eating the contribution graph (light and dark) and publishes
# the two SVGs to the "output" branch, which the profile README shows.
# Same steps as the action author's own profile (Platane/Platane, main.yml).
name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"     # every day at 00:00 UTC
  workflow_dispatch:         # run it by hand from the Actions tab
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate the snake from the contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push the SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
